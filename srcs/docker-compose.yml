services:
  mariadb:
    build:
      #construction de mariadb en allant dans le rep et le fichier
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    image: mariadb
    restart: always
    #monte le volume persistant dans le conteneur
    volumes:
      - mariadb_volume:/var/lib/mysql
    #cherche les variables d'env et les injecte dans le conteneur
    environment:
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    #pareil mais pour les mdp
    secrets:
      - db_root_password
      - db_password
    #du reseau inception
    networks:
      - inception_net

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    image: wordpress
    restart: always
    #demarrer mariadb avant wp
    depends_on:
      - mariadb
    #dossier partagé entre wp et nginx
    volumes:
      - wordpress_volume:/var/www/html
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      SIMPLE_USER_PWD: ${SIMPLE_USER_PWD}
      #indique que la database est dans ce conteneur
      MYSQL_HOST: mariadb
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      WP_ADMIN_PASSWORD_FILE: /run/secrets/credentials
    secrets:
      - db_password
      - credentials
    networks:
      - inception_net

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    image: nginx
    restart: always
    depends_on:
      - wordpress
    # ouvre le port 443 de l'hote et redirige le trafic vers le 443 du conteneur
    ports:
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    #volume partagé avec wordpress
    volumes:
      - wordpress_volume:/var/www/html
    networks:
      - inception_net

#lier les dossiers du conteneurs à ceux de la machine hôte pour assurer la persistance
#des données dans le disque dur de la machine hôte
volumes:
  mariadb_volume:
    driver: local
    driver_opts:
      type: none
      o: bind # binder le vo,ume du container à celui de la machine hôte
      device: ${HOME}/data/mariadb

  wordpress_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress

networks:
  #creer un reseau virtuel privé pour la communication des services
  inception_net:
    driver: bridge

#defini où docker va chercher les mdp
secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  credentials:
    file: ../secrets/credentials.txt
