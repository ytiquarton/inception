;config de php-fpm c'est lui qui gere les requetes de nginx
[www]
;definir user et group pour ne pas que ce soit root
user = www-data
group = www-data

listen = 0.0.0.0:9000
listen.owner = www-data
listen.group = www-data
;defini comment gerer la mémoire de php-fpm (reglages assez minimaux pour economiser la ram)
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
