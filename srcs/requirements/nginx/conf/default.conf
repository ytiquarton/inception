server {
    #ecouter le port 443 avec le protocole ssl
    listen 443 ssl;
    #pareil sauf que c'est pour l'ipv6
    listen [::]:443 ssl;

    server_name ${DOMAIN_NAME};

    #chemin relatifs au certificats
    ssl_certificate /etc/nginx/ssl/inception.crt;
    #clé privée chiffrement et déchiffrement client/serveur
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    #autorisations que des derniers protocoles
    ssl_protocols TLSv1.2 TLSv1.3;


    root /var/www/html;

    #priorité des pages par défauts
    index index.php index.html index.htm;

    location / {
        #comment traiter une requete (chercher fichier uri sinon dossier uri sinon on redirige vers l'index)
        try_files $uri $uri/ /index.php?$args;
    }

    #definition des regle des fichiers qui se terminent par php
    location ~ \.php$ {
        #fichier standard de parametres pour fastcgi
        include fastcgi_params;
        # def du port fast_cgi de transmission wp et nginx
        fastcgi_pass wordpress:9000;
        # index par défaut pour les scripts fastcgi
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    #fast_cgi étant le protocole pour communiquer entre server web (nginx) et php qui sert à l'execution dynamique
    #il lance des sous processus en arriere plans pour maintenir un etat stable du serveur
    #c'est le php-fpm
}
